[project]
name = "print-desktop"
version = "0.1.0"
description = "3D Print cost calculator — native macOS desktop client for the print-calc backend."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Thulani Maseko", email = "ltmaseko7@gmail.com" }]

dependencies = [
    "PySide6>=6.6,<6.9",
    "qasync>=0.27",
    "qtawesome>=1.3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "pip-audit>=2.7",
]
build = [
    "py2app>=0.28",
    "setuptools<70",
]

[project.scripts]
print-desktop = "print_desktop.__main__:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
